<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DateIn — Professional dating</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <div class="brand" data-view="discover">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <path d="M8 14s1.5 2 4 2 4-2 4-2" />
          <line x1="9" y1="9" x2="9.01" y2="9" />
          <line x1="15" y1="9" x2="15.01" y2="9" />
        </svg>
        <span class="brand-name">DateIn</span>
      </div>
      <div class="nav-search">
        <input type="text" placeholder="Search by name, company, or skill..." id="navSearch" />
      </div>
      <div class="nav-links">
        <button class="nav-link active" data-view="discover">
          <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <span>Discover</span>
        </button>
        <button class="nav-link" data-view="matches">
          <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>Matches</span>
          <span class="badge hidden" id="matchBadge">0</span>
        </button>
        <button class="nav-link" data-view="messages">
          <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span>Messaging</span>
          <span class="badge hidden" id="msgBadge">0</span>
        </button>
        <button class="nav-link" data-view="profile">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Me</span>
        </button>
      </div>
    </div>
  </nav>

  <main class="container">
    <section id="view-discover" class="view active">
      <div class="discover-layout">
        <div class="stack">
          <div class="stack-overlay" id="stackOverlay"></div>
          <div id="cardStack"></div>
          <div class="empty-state hidden" id="discoverEmpty">
            <h2>You've seen everyone nearby</h2>
            <p>Try widening your search criteria, or check back later.</p>
            <button class="btn-primary" id="resetDiscover">Reset &amp; replay</button>
          </div>
          <div class="actions">
            <button class="action-btn pass" id="btnPass" title="Pass">
              <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
            <button class="action-btn super" id="btnSuper" title="Super Like">
              <svg viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
            </button>
            <button class="action-btn like" id="btnLike" title="Like">
              <svg viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
            </button>
          </div>
        </div>

        <aside class="sidebar">
          <h3>Compatibility radar</h3>
          <div id="compatList" class="compat-list"></div>
        </aside>
      </div>
    </section>

    <section id="view-matches" class="view">
      <header class="view-header">
        <h1>Your matches</h1>
        <p>Mutual professional chemistry.</p>
      </header>
      <div id="matchesGrid" class="grid"></div>
    </section>

    <section id="view-messages" class="view">
      <div class="chat-layout">
        <aside class="conv-list" id="convList"></aside>
        <div class="chat-main" id="chatMain">
          <div class="chat-placeholder" id="chatPlaceholder">
            <h3>Select a conversation</h3>
            <p>Talk shop, swap career advice, and get to know each other.</p>
          </div>
          <div class="chat-window hidden" id="chatWindow">
            <div class="chat-header" id="chatHeader"></div>
            <div class="chat-body" id="chatBody"></div>
            <div class="chat-input-row">
              <input type="text" id="chatInput" placeholder="Write a message..." />
              <button class="btn-primary" id="btnSend">Send</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="view-profile" class="view">
      <div class="profile-layout">
        <div class="profile-card-own">
          <div class="profile-cover"></div>
          <div class="profile-avatar" id="myAvatar"></div>
          <h1 id="myName">You</h1>
          <p class="headline" id="myHeadline"></p>
          <p class="meta" id="myMeta"></p>
          <div class="profile-actions">
            <button class="btn-primary" id="btnEdit">Edit profile</button>
            <button class="btn-ghost" id="btnReset">Reset demo data</button>
          </div>
        </div>
        <div class="profile-editor hidden" id="profileEditor">
          <h2>Edit profile</h2>
          <label>Name</label>
          <input type="text" id="fName" />
          <label>Headline</label>
          <input type="text" id="fHeadline" />
          <label>Location</label>
          <input type="text" id="fLocation" />
          <label>About</label>
          <textarea id="fAbout" rows="3"></textarea>
          <label>Skills (comma separated)</label>
          <input type="text" id="fSkills" />
          <label>Interests (comma separated)</label>
          <input type="text" id="fInterests" />
          <div class="editor-actions">
            <button class="btn-primary" id="btnSave">Save</button>
            <button class="btn-ghost" id="btnCancel">Cancel</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="call-overlay hidden" id="callOverlay">
    <div class="call-top">
      <div>
        <div class="call-name" id="callName">Calling...</div>
        <div class="call-status" id="callStatus">Connecting</div>
      </div>
    </div>
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>
    <div class="call-controls">
      <button class="call-btn" id="callMute" title="Mute microphone">
        <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </button>
      <button class="call-btn" id="callVideoToggle" title="Toggle camera">
        <svg viewBox="0 0 24 24"><path d="m22 8-6 4 6 4V8Z"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>
      </button>
      <button class="call-btn hang" id="callEnd" title="End call">
        <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      </button>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
